<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Louis Ghiglione</title>
  <meta name="description" content="Contact Louis Ghiglione via LinkedIn or Email." />
  <link rel="canonical" href="https://louis289.github.io/portfolio-louis-ghiglione/contact.html" />
  <meta property="og:title" content="Contact — Louis Ghiglione" />
  <meta property="og:type"  content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/template.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body data-page="contact">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="nav-placeholder"></div>

  <main id="main-content" class="page-content">
    <div class="page-wrapper">

      <header class="page-header">
        <span class="section-tag" data-i18n="contact.tag"></span>
        <h1 class="section-title" data-i18n="contact.title"></h1>
        <p class="section-desc"   data-i18n="contact.desc"></p>
      </header>

      <div class="contact-card-wrapper" id="contact-tilt-wrapper">
        <div class="contact-card" id="contact-tilt-card">
          <div class="contact-card__glare" id="contact-tilt-glare"></div>
          
          <div class="contact-card__content">
            <img src="" alt="" class="contact-card__avatar" data-bind="src:config.avatar_url; alt:config.name" />
            
            <div class="contact-card__info">
              <h2 class="contact-card__name" data-bind="text:config.name"></h2>
              <p class="contact-card__title" data-i18n="contact.contact_sub"></p>
              
              <div class="contact-card__links">
                <a href="#" class="contact-card__link" data-bind="href:config.email_mailto">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                  <span data-bind="text:config.email_display"></span>
                </a>
                <a href="#" class="contact-card__link" target="_blank" rel="noopener" data-bind="href:config.linkedin_url">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                  <span data-bind="text:config.linkedin_display"></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <p data-i18n-html="footer"></p>
  </footer>

  <div id="modal-container" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" aria-label="Close modal">&times;</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
