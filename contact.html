<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Louis Ghiglione</title>
  <meta name="description" content="Contact Louis Ghiglione via LinkedIn or Email." />
  <link rel="canonical" href="https://louis289.github.io/portfolio-louis-ghiglione/contact.html" />
  <meta property="og:title" content="Contact — Louis Ghiglione" />
  <meta property="og:type"  content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body data-page="contact">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob--purple"></div>
    <div class="blob blob--cyan"></div>
  </div>
  <div id="nav-placeholder"></div>

  <main id="main-content" class="page-content">
    <div class="page-wrapper">

      <header class="page-header">
        <span class="section-tag" data-i18n="contact.tag"></span>
        <h1 class="section-title" data-i18n="contact.title"></h1>
        <p class="section-desc"   data-i18n="contact.desc"></p>
      </header>

      <ul class="grid-2" role="list">
        <li class="card">
          <span class="card__icon" aria-hidden="true">📧</span>
          <h2 class="card__title" data-i18n="contact.email"></h2>
          <p class="card__body"><a href="#" data-bind="href:config.email_mailto; text:config.email_display"></a></p>
        </li>

        <li class="card">
          <span class="card__icon" aria-hidden="true">💼</span>
          <h2 class="card__title" data-i18n="contact.linkedin"></h2>
          <p class="card__body"><a href="#" target="_blank" rel="noopener" data-bind="href:config.linkedin_url; text:config.linkedin_display"></a></p>
        </li>
      </ul>

    </div>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer"></p>
  </footer>

  <div id="modal-container" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" aria-label="Close modal">&times;</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
