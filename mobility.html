<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobility — Louis Ghiglione</title>
  <meta name="description" content="Three international mobility projects by Louis Ghiglione, N7 engineering student." />
  <link rel="canonical" href="https://louis289.github.io/portfolio-louis-ghiglione/mobility.html" />
  <meta property="og:title" content="Mobility — Louis Ghiglione" />
  <meta property="og:type"  content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body data-page="mobility">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="nav-placeholder"></div>

  <main id="main-content" class="page-content">
    <div class="page-wrapper">

      <header class="page-header">
        <span class="section-tag" data-i18n="mobility.tag"></span>
        <h1 class="section-title" data-i18n="mobility.title"></h1>
        <p class="section-desc"   data-i18n="mobility.desc"></p>
      </header>

      <!-- Leaflet interactive map -->
      <div id="mobility-map" role="application" aria-label="Interactive mobility destinations map"></div>

      <ul class="grid-3" role="list">

        <li class="card">
          <span class="card__icon" aria-hidden="true">01</span>
          <h2 class="card__title" data-i18n="mobility.d1_title"></h2>
          <p class="card__body"   data-i18n="mobility.d1_desc"></p>
          <div class="card__tags">
            <span class="badge" data-i18n="mobility.d1_country"></span>
            <span class="badge" data-i18n="mobility.d1_period"></span>
          </div>
        </li>

        <li class="card">
          <span class="card__icon" aria-hidden="true">02</span>
          <h2 class="card__title" data-i18n="mobility.d2_title"></h2>
          <p class="card__body"   data-i18n="mobility.d2_desc"></p>
          <div class="card__tags">
            <span class="badge" data-i18n="mobility.d2_country"></span>
            <span class="badge" data-i18n="mobility.d2_period"></span>
          </div>
        </li>

        <li class="card">
          <span class="card__icon" aria-hidden="true">03</span>
          <h2 class="card__title" data-i18n="mobility.d3_title"></h2>
          <p class="card__body"   data-i18n="mobility.d3_desc"></p>
          <div class="card__tags">
            <span class="badge" data-i18n="mobility.d3_country"></span>
            <span class="badge" data-i18n="mobility.d3_period"></span>
          </div>
        </li>

      </ul>

    </div>
  </main>

  <footer class="site-footer">
    <p data-i18n-html="footer"></p>
  </footer>

  <!-- Leaflet JS — loaded before module so L is globally available -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
