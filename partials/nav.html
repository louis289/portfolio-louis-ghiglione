<!-- Settings Modal -->
<div class="settings-backdrop" id="settings-modal" aria-hidden="true">
  <div class="settings-content" role="dialog" aria-modal="true" aria-label="Settings">
    <button class="settings-close" id="settings-close" aria-label="Close settings">&times;</button>
    <h2 data-i18n="settings.title">Settings</h2>
    
    <div class="settings-group">
      <h3 data-i18n="settings.theme">Theme Gallery</h3>
      <select id="theme-selector" class="settings-btn" style="width: 100%; padding: 0.5rem; border-radius: 4px; background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); font-family: inherit;">
        <optgroup label="Dark Themes">
          <option value="dark-default">Dark (Default)</option>
          <option value="dracula">Dracula</option>
          <option value="nord">Nord</option>
          <option value="matrix">Matrix</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="midnight">Midnight Navy</option>
          <option value="github-dark">GitHub Dark</option>
          <option value="material-dark">Material Dark</option>
          <option value="forest-night">Forest Night</option>
          <option value="outrun">Outrun (Synthwave)</option>
        </optgroup>
        <optgroup label="Light Themes">
          <option value="light-default">Light (Corporate)</option>
          <option value="solarized-light">Solarized Light</option>
          <option value="github-light">GitHub Light</option>
          <option value="sepia">Sepia (Reading)</option>
          <option value="pastel-breeze">Pastel Breeze</option>
          <option value="corporate-blue">Corporate Blue</option>
          <option value="minimalist">Minimalist (Monochrome)</option>
          <option value="mint">Mint Fresh</option>
          <option value="sunset">Sunset Glow</option>
          <option value="lavender">Soft Lavender</option>
        </optgroup>
      </select>
    </div>
    
    <div class="settings-group">
      <h3 data-i18n="settings.effect">Effects Gallery</h3>
      <select id="fx-selector" class="settings-btn" style="width: 100%; padding: 0.5rem; border-radius: 4px; background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); font-family: inherit;">
        <option value="electric">Electric (Default)</option>
        <option value="terminal">Terminal Scanlines</option>
        <option value="fluid">Fluid Gradient</option>
        <option value="matrix">Matrix / Grid</option>
        <option value="none">None (Clean)</option>
      </select>
    </div>
    
    <div class="settings-group">
      <h3 data-i18n="settings.language">Language</h3>
      <div class="settings-options">
        <button class="settings-btn" id="set-lang-en">English</button>
        <button class="settings-btn" id="set-lang-fr">Français</button>
      </div>
    </div>
    
    <div class="settings-group">
      <h3 data-i18n="settings.a11y">Accessibility</h3>
      <div class="settings-options">
        <button class="settings-btn" id="set-a11y-off" data-i18n="settings.a11y_off">Standard</button>
        <button class="settings-btn" id="set-a11y-on" data-i18n="settings.a11y_on">Accessible</button>
      </div>
    </div>
    
    <div class="settings-group">
      <h3 data-i18n="settings.download">Download</h3>
      <button class="settings-btn" id="btn-download-pdf" data-i18n="settings.download_btn">Download Portfolio as PDF</button>
    </div>
  </div>
</div>
