<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louis Ghiglione — E-Portfolio</title>
  <meta name="description" content="E-Portfolio of Louis Ghiglione, N7 engineering student and apprentice." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #080b14;
      --surface:  #0f1322;
      --card:     rgba(255,255,255,0.04);
      --border:   rgba(255,255,255,0.08);
      --accent:   #6d4aff;
      --accent2:  #00d4ff;
      --text:     #f0f4ff;
      --muted:    #7a85a3;
      --nav-h:    68px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      line-height: 1.7;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: rgba(8,11,20,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }

    .nav-logo {
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      gap: 0.15rem;
      list-style: none;
      flex-wrap: wrap;
    }

    .nav-links a {
      display: block;
      padding: 0.38rem 0.85rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      white-space: nowrap;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--card);
    }

    /* ── LANG SWITCHER ── */
    .lang-switcher {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .lang-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      color: var(--muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      letter-spacing: 0.05em;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }

    .lang-btn:hover:not(.active) { color: var(--text); }

    /* ── SECTIONS ── */
    section {
      display: none;
      min-height: 100vh;
      padding: calc(var(--nav-h) + 3rem) 2.5rem 4rem;
      max-width: 1100px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease both;
    }

    section.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── HERO ── */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - var(--nav-h));
      padding: 0;
      gap: 2rem;
    }

    .hero-blob-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.2;
      animation: drift 10s ease-in-out infinite alternate;
    }

    .blob-1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -200px; }
    .blob-2 { width: 500px; height: 500px; background: var(--accent2); bottom: -150px; right: -150px; animation-delay: -5s; }

    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(50px,40px) scale(1.1); }
    }

    .hero-content { position: relative; z-index: 1; }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent2);
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.25);
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 40%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.2rem;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 580px;
      margin-bottom: 2rem;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      font-family: 'Outfit', sans-serif;
      padding: 0.8rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }

    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(109,74,255,0.4);
    }

    /* ── SECTION HEADER ── */
    .section-header { margin-bottom: 3rem; }

    .section-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(109,74,255,0.1);
      border: 1px solid rgba(109,74,255,0.25);
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .section-header h2 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.8rem;
    }

    .section-header p {
      color: var(--muted);
      max-width: 560px;
      font-size: 1.05rem;
    }

    /* ── CARDS ── */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 1.5rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(109,74,255,0.4);
      box-shadow: 0 16px 50px rgba(109,74,255,0.15);
    }

    .card-icon { font-size: 1.8rem; margin-bottom: 1rem; }
    .card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.6rem; }
    .card p   { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }

    /* ── PHOTO PLACEHOLDER ── */
    .photo-placeholder {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      border: 3px solid var(--border);
      flex-shrink: 0;
    }

    /* ── CAREER ITEMS ── */
    .career-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      transition: border-color 0.25s;
    }

    .career-item:hover { border-color: rgba(109,74,255,0.4); }

    .career-num {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      min-width: 2rem;
    }

    .career-item h3 { font-weight: 700; margin-bottom: 0.4rem; }
    .career-item p  { color: var(--muted); font-size: 0.9rem; }

    /* ── BADGES ── */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.2);
      color: var(--accent2);
      margin: 0.2rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .badge:hover { background: rgba(0,212,255,0.2); }

    /* ── MAP PLACEHOLDER ── */
    .map-placeholder {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }

    a.ext {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 600;
    }
    a.ext:hover { text-decoration: underline; }

    .site-footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

  <script>
    // ── State ──
    let currentLang = 'en';
    let translations = {};

    // ── Load translations ──
    fetch('translations.json')
      .then(r => r.json())
      .then(data => {
        translations = data;
        applyLang(currentLang);
      });

    // ── Apply language ──
    function applyLang(lang) {
      currentLang = lang;
      const t = translations[lang];
      if (!t) return;

      // Flat key resolver: "nav.welcome" → t.nav.welcome
      function resolve(keyPath) {
        return keyPath.split('.').reduce((obj, k) => obj?.[k], t) ?? '';
      }

      // Text content
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = resolve(el.dataset.i18n);
        if (val) el.textContent = val;
      });

      // HTML content (for <br/> in hero h1)
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const val = resolve(el.dataset.i18nHtml);
        if (val) el.innerHTML = val;
      });

      // Update html lang attribute
      document.documentElement.lang = lang;

      // Update lang buttons
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
    }

    function setLang(lang) {
      applyLang(lang);
    }

    // ── Tab switching ──
    function showTab(id) {
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('nav-' + id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
